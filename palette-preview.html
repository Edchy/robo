<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palettkontroll</title>
<link rel="stylesheet" href="/src/ScheduleApp.css">
<style>
  body { padding: 24px; max-width: 480px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--ink-muted); margin: 28px 0 10px; }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; padding: 14px 8px; border-radius: 10px; font-size: 13px;
        font-weight: 600; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center;
          font-size: 13px; font-weight: 600; }
  .gs { filter: grayscale(1); }
</style>
</head>
<body>
  <h2>Banden i ordning</h2>
  <div class="row" id="bands"></div>

  <h2>Gråskala (utskrift)</h2>
  <div class="row gs" id="bandsGs"></div>

  <h2>Jour / sovande jour</h2>
  <div class="row" id="extra"></div>

  <h2>Jour / sovande jour i gråskala</h2>
  <div class="row gs" id="extraGs"></div>

  <h2>Månad</h2>
  <div class="grid" id="cal"></div>

  <h2>Månad i gråskala</h2>
  <div class="grid gs" id="calGs"></div>

<script type="module">
const bands = [['morning','Morgon'],['day','Dag'],['evening','Kväll'],['night','Natt']];
const extra = [['jour','Jour'],['sleep','Sov. jour']];
const sw = ([k,label]) => `<div class="sw shift-block--${k}">${label}</div>`;
document.getElementById('bands').innerHTML = bands.map(sw).join('');
document.getElementById('bandsGs').innerHTML = bands.map(sw).join('');
document.getElementById('extra').innerHTML = extra.map(sw).join('');
document.getElementById('extraGs').innerHTML = extra.map(sw).join('');

// A plausible month: a rotation that puts every band next to every other.
const month = ['night','night','morning','day','','evening','evening',
               'morning','day','day','','night','night','morning',
               'evening','','day','morning','jour','evening','night',
               'day','day','sleep','morning','evening','','night',
               'morning','day'];
const cal = month.map((b,i) =>
  `<div class="cell ${b?`calendar-cell--${b}`:''}">${i+1}</div>`).join('');
document.getElementById('cal').innerHTML = cal;
document.getElementById('calGs').innerHTML = cal;
</script>
</body>
</html>
